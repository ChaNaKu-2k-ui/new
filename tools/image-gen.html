<style>
  .ig-panel { display: flex; flex-direction: column; gap: 14px; }

  .ig-prompt-wrap { display: flex; flex-direction: column; gap: 10px; }

  .ig-prompt-wrap textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--input-bg, var(--surface2, #1e2023));
    border: 1.5px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 0.97rem;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.15s;
  }
  .ig-prompt-wrap textarea:focus { border-color: var(--accent); }

  .ig-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ig-controls select {
    flex: 1;
    min-width: 130px;
    padding: 9px 12px;
    border-radius: 8px;
    background: var(--input-bg, var(--surface2, #1e2023));
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 0.9rem;
    outline: none;
    cursor: pointer;
  }
  .ig-controls select:focus { border-color: var(--accent); }

  #ig-status {
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 18px;
  }
  #ig-status.error { color: #e05; }

  .ig-result {
    text-align: center;
  }
  .ig-result img {
    max-width: 100%;
    border-radius: 12px;
    border: 2px solid var(--accent);
    box-shadow: 0 4px 32px rgba(0,0,0,0.25);
    display: none;
  }
  .ig-result img.loaded { display: inline-block; }

  .ig-download {
    display: none;
    margin-top: 10px;
  }
  .ig-download.visible { display: block; }

  .ig-note {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    margin-top: 4px;
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="tool-page">
<div class="tool-hero">
  <a class="back" href="../index.html#tools">All tools</a>
  <div class="title-row">
    <span class="ico big">
      <svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>
        <rect x='3' y='3' width='18' height='18' rx='3'/>
        <circle cx='8.5' cy='8.5' r='1.5'/>
        <path d='M21 15l-5-5L5 21'/>
      </svg>
    </span>
    <h1>AI Image Generator</h1>
  </div>
  <span class="catchip">Creator</span>
  <p class="lede">Type a description and generate AI art — anime, fantasy, portraits and more.</p>
</div>

<div class="panel stack ig-panel">
  <div class="ig-prompt-wrap">
    <label for="ig-prompt">Describe your image</label>
    <textarea id="ig-prompt" placeholder="anime girl, magical forest, glowing lights, fantasy art style, highly detailed…" rows="3"></textarea>
  </div>

  <div class="ig-controls">
    <select id="ig-ratio" aria-label="Aspect ratio">
      <option value="1024x1024">Square (1:1)</option>
      <option value="1280x720">Landscape (16:9)</option>
      <option value="720x1280">Portrait (9:16)</option>
      <option value="1024x768">Wide (4:3)</option>
    </select>
    <select id="ig-model" aria-label="AI model">
      <option value="flux">Flux (default)</option>
      <option value="flux-realism">Flux Realism</option>
      <option value="flux-anime">Flux Anime</option>
      <option value="turbo">Turbo (fast)</option>
    </select>
    <button class="btn primary" id="ig-btn" type="button">Generate</button>
  </div>

  <div id="ig-status" role="status" aria-live="polite"></div>

  <div class="ig-result">
    <img id="ig-img" alt="Generated image">
  </div>

  <div class="ig-download" id="ig-dl-wrap">
    <button class="btn" id="ig-dl-btn" type="button">⬇ Download image</button>
  </div>

  <p class="ig-note">Images are generated by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations AI</a>. Your prompt is sent to their servers.</p>
</div>

<section id="related" class="related"></section>
</main>
<footer id="site-footer"></footer>
<script src="../js/tools-data.js"></script>
<script src="../js/layout.js" data-root="../" defer></script>
<script>
  let igCurrentUrl = '';

  function igGenerate() {
    const prompt = document.getElementById('ig-prompt').value.trim();
    if (!prompt) { document.getElementById('ig-status').textContent = 'Enter a description first.'; return; }

    const ratio = document.getElementById('ig-ratio').value;
    const model = document.getElementById('ig-model').value;
    const [w, h] = ratio.split('x');
    const seed = Math.floor(Math.random() * 9999999);

    const btn = document.getElementById('ig-btn');
    btn.disabled = true;
    const status = document.getElementById('ig-status');
    status.className = '';
    status.textContent = 'Generating… this may take 10–20 seconds';

    const img = document.getElementById('ig-img');
    img.classList.remove('loaded');
    document.getElementById('ig-dl-wrap').classList.remove('visible');

    igCurrentUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?model=${model}&width=${w}&height=${h}&seed=${seed}&nologo=true&safe=false`;

    img.onload = function() {
      img.classList.add('loaded');
      status.textContent = '✓ Done';
      document.getElementById('ig-dl-wrap').classList.add('visible');
      btn.disabled = false;
    };
    img.onerror = function() {
      status.className = 'error';
      status.textContent = 'Generation failed — try a different prompt or model.';
      btn.disabled = false;
    };
    img.src = igCurrentUrl;
  }

  function igDownload() {
    const a = document.createElement('a');
    a.href = igCurrentUrl;
    a.download = 'chanaku-image.png';
    a.target = '_blank';
    a.click();
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('ig-btn').addEventListener('click', igGenerate);
    document.getElementById('ig-dl-btn').addEventListener('click', igDownload);
    document.getElementById('ig-prompt').addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'Enter') igGenerate();
    });
  });
</script>
</body>
</html>
