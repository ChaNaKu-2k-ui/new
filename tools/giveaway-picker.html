<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main" class="wrap">
<div class="page-head">
  <a class="back" href="../index.html#tools">All tools</a>
  <h1>Giveaway winner picker</h1>
  <p class="lede">Paste entries and draw fair random winners.</p>
</div>
<div class="panel stack">
  <div><label for="names">Entries (one per line)</label>
  <textarea id="names" placeholder="Paste usernames or names, one on each line" spellcheck="false"></textarea></div>
  <div class="row" style="gap:12px 22px">
    <div style="width:130px"><label for="n">Winners</label><input id="n" type="number" min="1" max="100" value="1"></div>
    <label class="check" style="margin-top:22px"><input id="dedupe" type="checkbox" checked>Remove duplicate entries</label>
    <div class="note" style="margin-top:22px"><b id="entries">0</b> entries</div>
  </div>
  <div class="row"><button class="btn primary" id="pick" type="button">Pick winners</button><span id="status" class="status" role="status"></span></div>
  <ol id="winners" class="winners" aria-live="polite"></ol>
</div>
<p class="note prose">Each entry has an equal chance and nobody can win twice in one draw. Press the button again for a fresh draw. For a public giveaway, record your screen while you draw.</p>
<section id="related" class="related"></section>
</main>
