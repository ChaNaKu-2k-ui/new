    <!-- Primary Meta Tags -->

<!-- Open Graph / Facebook / WhatsApp / Telegram -->

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">

    <style>
        body { margin: 0 !important; padding: 0 !important; display: block !important; min-height: 100vh; }
        header { margin-bottom: 10px !important; padding-bottom: 0 !important; }
        .container { margin-top: 0 !important; padding-top: 0 !important; }
        .page-section { padding-top: 0 !important; margin-top: 0 !important; }
        .content-box { margin-top: 0 !important; text-align: center; padding: 40px 20px; }

        /* Profile සැකසුම් */
        .profile-container { margin-bottom: 35px; }
        .profile-pic { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 3px solid #00ff88; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); 
            object-fit: cover; 
            margin-bottom: 15px; 
        }
        .profile-name { 
            font-size: 28px; 
            font-weight: bold; 
            margin: 0; 
            background: linear-gradient(135deg, #00ff88 0%, #00b4db 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .profile-bio { color: #a0a0a0; font-size: 15px; margin-top: 8px; font-weight: 500; }

        /* Social Links Container */
        .social-links { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            max-width: 450px; 
            margin: 0 auto; 
        }
        
        /* Advanced Button විලාසය */
        .social-btn { 
            display: flex; 
            align-items: center; 
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #e0e0e0; 
            text-decoration: none; 
            padding: 12px 15px; 
            border-radius: 15px; 
            transition: all 0.3s ease; 
            position: relative; 
            overflow: hidden;
            text-align: left;
        }

        /* Button එක ඇතුළේ ඇති Profile පින්තූරය */
        .btn-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* නම සහ Username පෙන්වන කොටස */
        .btn-info {
            flex-grow: 1;
            margin-left: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 3px;
        }

        .btn-stats {
            font-size: 13px;
            color: #a0a0a0;
            font-weight: 500;
        }

        /* සමාජ මාධ්‍ය Icon එක */
        .platform-icon {
            font-size: 24px;
            opacity: 0.8;
            transition: all 0.3s ease;
        }

        /* Hover Effects */
        .social-btn:hover { transform: translateY(-4px); }
        .social-btn:hover .platform-icon { opacity: 1; transform: scale(1.1); }
        
        .social-btn.yt:hover { border-color: #ff0000; box-shadow: 0 5px 20px rgba(255, 0, 0, 0.3); background: rgba(255, 0, 0, 0.1); }
        .social-btn.fb:hover { border-color: #1877f2; box-shadow: 0 5px 20px rgba(24, 119, 242, 0.3); background: rgba(24, 119, 242, 0.1); }
        .social-btn.tt:hover { border-color: #00f2fe; box-shadow: 0 5px 20px rgba(0, 242, 254, 0.3); background: rgba(255, 255, 255, 0.1); } 
        .social-btn.dc:hover { border-color: #5865F2; box-shadow: 0 5px 20px rgba(88, 101, 242, 0.3); background: rgba(88, 101, 242, 0.1); }
        .social-btn.tg:hover { border-color: #0088cc; box-shadow: 0 5px 20px rgba(0, 136, 204, 0.3); background: rgba(0, 136, 204, 0.1); }
    </style>
</head>
<body>
