<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Verification Portal - DevTools Hub</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* උඩ හිස් ඉඩ ඉවත් කිරීම */
        body { margin: 0 !important; padding: 0 !important; display: block !important; min-height: 100vh; }
        header { margin-bottom: 10px !important; padding-bottom: 0 !important; }
        .container { margin-top: 0 !important; padding-top: 0 !important; }
        .page-section { padding-top: 0 !important; margin-top: 0 !important; }
        .content-box { margin-top: 0 !important; }

        /* Description Box style */
        .desc-box { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 12px; margin-bottom: 20px; color: #e0e0e0; font-size: 15px; line-height: 1.6; text-align: left; }
        
        /* Image Blur style */
        .image-blur-container { position: relative; max-width: 500px; margin: 25px auto; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 25px rgba(0,0,0,0.5); background: #111; }
        .task-img { width: 100%; height: auto; display: block; filter: blur(25px); pointer-events: none; transition: filter 0.8s ease; }
        .blur-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0, 0, 0, 0.5); transition: opacity 0.5s ease; padding: 20px; box-sizing: border-box; text-align: center; }
        
        /* Button style */
        .timer-btn { background: linear-gradient(135deg, #00ff88 0%, #00b4db 100%); color: #000; border: none; padding: 15px 35px; font-size: 16px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4); transition: all 0.3s ease; }
        .timer-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0, 255, 136, 0.6); }
        .timer-btn:disabled { background: #2c3e50; color: #bdc3c7; cursor: not-allowed; }
        .hint-text { color: #fff; font-size: 14px; margin-top: 15px; font-weight: 500; }
        .warning-text { color: #ff4757; font-weight: bold; margin-top: 5px; font-size: 13px; }

        /* YouTube Video Box */
        .video-ad-container { 
            position: relative; 
            max-width: 500px; 
            margin: 0 auto 20px auto; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5); 
            background: #000; 
        }
        .video-ad-container iframe { 
            width: 100%; 
            height: 280px; 
            border: none; 
            display: block; 
        }
        
        /* උඩ Title සහ Logo වසන කළු කොටුව */
        .top-block {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 60px; 
            background: #000;
            z-index: 5;
        }

        /* යට Timeline එක සහ Watch on YouTube වසන කළු කොටුව */
        .bottom-block {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50px; 
            background: #000;
            z-index: 5;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-link">
            <img src="logo.png" alt="DevTools Logo" class="site-logo">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </header>

    <div class="container">
        <section class="page-section active-section">
            <div class="content-box">
                <h2>🎯 Step-02: Content Unlock Verification</h2>
                
                <!-- 1. Blur Image එක -->
                <div class="image-blur-container">
                    <img id="taskImage" alt="Task Guide Image" class="task-img">
                    <div class="blur-overlay" id="blurOverlay">
                        <button class="timer-btn" id="actionBtn" onclick="startTaskTimer()">🔓 Click to Unlock Image</button>
                        <p class="hint-text" id="statusHint">You must wait 60 seconds to completely clear the image.</p>
                        <p class="warning-text" id="warningText" style="display: none;">Video paused! Timer reset to 60s.</p>
                    </div>
                </div>

                <!-- 2. Text File Description එක -->
                <div id="taskDescription" class="desc-box">Loading description...</div>

                <!-- 3. Dynamic YouTube Video Player එක -->
                <div class="video-ad-container">
                    <div class="top-block"></div>
                    <div id="ytplayer"></div>
                    <div class="bottom-block"></div>
                </div>

            </div>
        </section>
    </div>

    <footer>&copy; 2026 DevTools Hub. All Rights Reserved.</footer>

    <script>
        // 1. Task description එක load කිරීම
        fetch('notes/task1.txt')
            .then(response => response.text())
            .then(data => { document.getElementById('taskDescription').innerText = data; })
            .catch(error => { document.getElementById('taskDescription').innerText = "Description could not be loaded."; });

        // 2. Image එක load කිරීම
        document.getElementById('taskImage').src = 'images/task1.jpg?t=' + new Date().getTime();

        // 3. YouTube API & Player සැකසීම
        var player;
        var videoIdFromTxt = '';
        var isApiReady = false;

        function extractYouTubeID(url) {
            url = url.trim();
            var regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            var match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : url;
        }

        fetch('links/task1.txt')
            .then(response => response.text())
            .then(data => {
                videoIdFromTxt = extractYouTubeID(data);
                if (isApiReady && videoIdFromTxt) {
                    createYTPlayer(videoIdFromTxt);
                }
            })
            .catch(error => { console.error("Video link load error:", error); });

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            isApiReady = true;
            if (videoIdFromTxt) {
                createYTPlayer(videoIdFromTxt);
            }
        }

        function createYTPlayer(vId) {
            player = new YT.Player('ytplayer', {
                height: '280',
                width: '100%',
                videoId: vId,
                playerVars: {
                    'playsinline': 1,
                    'controls': 0,
                    'rel': 0,
                    'modestbranding': 1,
                    'disablekb': 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // ප්ලේයර් එක සූදානම් වූ වහාම ශබ්දය 1% කරයි
            event.target.setVolume(1);
        }

        // 4. Timer එක සහ Video State Control (තත්පර 60)
        const totalTime = 60;
        let timeLeft = totalTime; 
        let isTimerStarted = false; 
        let timerId;

        function onPlayerStateChange(event) {
            if (isTimerStarted && timeLeft > 0 && (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED)) {
                resetTimer();
            }
        }

        function resetTimer() {
            clearInterval(timerId);
            isTimerStarted = false;
            timeLeft = totalTime;
            
            const btn = document.getElementById("actionBtn");
            btn.disabled = false;
            btn.innerText = "🔓 Click to Unlock Image";
            
            document.getElementById("warningText").style.display = "block";
            setTimeout(() => { document.getElementById("warningText").style.display = "none"; }, 4000);
        }

        function startTaskTimer() {
            if (isTimerStarted) return; 
            isTimerStarted = true;
            
            const btn = document.getElementById("actionBtn");
            btn.disabled = true;
            document.getElementById("warningText").style.display = "none";

            if (player && typeof player.playVideo === 'function') {
                player.setVolume(1); // ශබ්දය තදින්ම 1% මට්ටමේ තබා Play කරයි
                player.playVideo();
            }
            
            timerId = setInterval(() => {
                timeLeft--;
                btn.innerText = `⏳ Unlocking in ${timeLeft}s...`;
                
                if (timeLeft <= 0) {
                    clearInterval(timerId);
                    document.getElementById("taskImage").style.filter = "blur(0px)";
                    document.getElementById("blurOverlay").style.opacity = "0";
                    
                    setTimeout(() => {
                        document.getElementById("blurOverlay").style.display = "none";
                    }, 800);
                }
            }, 1000);
        }
    </script>
</body>
</html>
