<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cricket Legends - Advanced Engine</title>
    <link rel="stylesheet" href="../css/cricket.css">
</head>
<body>

<div class="ck-game" id="game">
    <div class="ck-screen">
        <canvas id="game-canvas"></canvas>
    </div>

    <div id="ui-layer">
        <div id="scoreboard" class="hidden">
            <div class="team-info">
                <span class="flag" id="team1-flag">🇱🇰</span>
                <span class="team-name" id="team1-name">SL</span>
                <span class="score" id="team1-score">0/0</span>
            </div>
            <div class="match-info">
                <span id="match-overs">0.0 / 20</span>
            </div>
            <div class="team-info">
                <span class="flag" id="team2-flag">🇮🇳</span>
                <span class="team-name" id="team2-name">IN</span>
                <span class="score" id="team2-score">-</span>
            </div>
        </div>

        <div id="player-stats" class="hidden">
            <div class="batsman">
                <span id="batsman-name">Batsman</span>
                <span id="batsman-runs">0 (0)</span>
            </div>
            <div class="bowler">
                <span id="bowler-name">Bowler</span>
                <span id="bowler-figures">0/0</span>
            </div>
        </div>

        <div id="action-bar" class="hidden">
            <div id="timing-bar-container">
                <div id="timing-zone"></div>
                <div id="timing-cursor"></div>
            </div>
            <div class="controls-hint" id="control-text">Press SPACE to swing</div>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <h1>CRICKET LEGENDS</h1>
        <p class="subtitle">Ultra-Advanced Engine</p>

        <div class="menu-section">
            <h2>Select Match Mode</h2>
            <div class="btn-group" id="mode-select">
                <button class="btn active" data-mode="T20">T20 Blast</button>
                <button class="btn" data-mode="ODI">ODI Chase</button>
            </div>
        </div>

        <div class="menu-section">
            <h2>Weather &amp; Time</h2>
            <div class="btn-group" id="weather-select">
                <button class="btn active" data-weather="DAY">&#x2600;&#xFE0F; Day</button>
                <button class="btn" data-weather="DUSK">&#x1F305; Dusk</button>
                <button class="btn" data-weather="NIGHT">&#x1F319; Night</button>
            </div>
        </div>

        <div class="menu-section">
            <h2>Select Teams</h2>
            <div class="team-picker">
                <div class="team-box">
                    <h3>You</h3>
                    <select id="team1-select"></select>
                </div>
                <div class="vs">VS</div>
                <div class="team-box">
                    <h3>Opponent</h3>
                    <select id="team2-select"></select>
                </div>
            </div>
        </div>

        <button id="start-btn" class="btn primary">Start Match</button>
    </div>

    <div id="toss-screen" class="overlay hidden">
        <h1>THE TOSS</h1>
        <div id="coin" class="coin"></div>
        <h2 id="toss-result">Flipping...</h2>
        <div id="toss-choices" class="hidden">
            <button class="btn" id="bat-btn">BAT</button>
            <button class="btn" id="bowl-btn">BOWL</button>
        </div>
    </div>

    <div id="result-screen" class="overlay hidden">
        <h1 id="result-title">MATCH OVER</h1>
        <h2 id="result-text">Team A won</h2>
        <button id="replay-btn" class="btn primary">Play Again</button>
    </div>
</div>

<script src="../js/games/cricket.js"></script>
</body>
</html>
