<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Socials - DevTools Hub</title>
    
    <!-- ඔබේ ප්‍රධාන CSS ෆයිල් එක -->
    <link rel="stylesheet" href="style.css"> 
    
    <!-- අයිකන් ලබා ගැනීම සඳහා FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ඔබ ලබාදුන් පිටුවට අදාළ පොදු සැකසුම් (Overrides) */
        body { margin: 0 !important; padding: 0 !important; display: block !important; min-height: 100vh; }
        header { margin-bottom: 10px !important; padding-bottom: 0 !important; }
        .container { margin-top: 0 !important; padding-top: 0 !important; }
        .page-section { padding-top: 0 !important; margin-top: 0 !important; }
        .content-box { margin-top: 0 !important; text-align: center; padding: 40px 20px; }

        /* --- Social Page එක සඳහා විශේෂිත Styles --- */
        
        /* Profile සැකසුම් */
        .profile-container { margin-bottom: 35px; }
        .profile-pic { 
            width: 130px; 
            height: 130px; 
            border-radius: 50%; 
            border: 3px solid #00ff88; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); 
            object-fit: cover; 
            margin-bottom: 15px; 
        }
        .profile-name { 
            font-size: 26px; 
            font-weight: bold; 
            margin: 0; 
            /* ඔබේ Site එකේ තිබූ Gradient වර්ණය */
            background: linear-gradient(135deg, #00ff88 0%, #00b4db 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .profile-bio { color: #a0a0a0; font-size: 15px; margin-top: 8px; font-weight: 500; }

        /* Social Links සැකසුම් */
        .social-links { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            max-width: 450px; 
            margin: 0 auto; 
        }
        
        /* Buttons වල Glassmorphism විලාසය */
        .social-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #e0e0e0; 
            text-decoration: none; 
            padding: 16px 25px; 
            font-size: 17px; 
            font-weight: 600; 
            border-radius: 12px; 
            transition: all 0.3s ease; 
            position: relative; 
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        
        .social-btn i { font-size: 22px; }

        /* Hover Effects - මවුස් එක ගෙන ගිය විට අදාළ සමාජ මාධ්‍යයේ වර්ණයෙන් බැබළීම */
        .social-btn:hover { transform: translateY(-4px); color: #fff; }
        
        .social-btn.yt:hover { border-color: #ff0000; box-shadow: 0 5px 20px rgba(255, 0, 0, 0.4); background: rgba(255, 0, 0, 0.1); }
        .social-btn.fb:hover { border-color: #1877f2; box-shadow: 0 5px 20px rgba(24, 119, 242, 0.4); background: rgba(24, 119, 242, 0.1); }
        .social-btn.tt:hover { border-color: #00f2fe; box-shadow: 0 5px 20px rgba(0, 242, 254, 0.4); background: rgba(255, 255, 255, 0.1); } 
        .social-btn.dc:hover { border-color: #5865F2; box-shadow: 0 5px 20px rgba(88, 101, 242, 0.4); background: rgba(88, 101, 242, 0.1); }
        .social-btn.tg:hover { border-color: #0088cc; box-shadow: 0 5px 20px rgba(0, 136, 204, 0.4); background: rgba(0, 136, 204, 0.1); }

    </style>
</head>
<body>

    <!-- ඔබ ලබාදුන් Header එක -->
    <header>
        <a href="index.html" class="logo-link">
            <img src="logo.png" alt="DevTools Logo" class="site-logo">
        </a>
        <div class="nav-links">
            <a href="index.html">Home</a>
        </div>
    </header>

    <div class="container">
        <section class="page-section active-section">
            <div class="content-box">
                
                <!-- Profile Section -->
                <div class="profile-container">
                    <!-- ඔබේ පින්තූරය මෙතනට දාන්න -->
                    <img src="images/profile.jpg" alt="Profile Picture" class="profile-pic">
                    
                    <h1 class="profile-name">CHANAKU</h1>
                    <p class="profile-bio">Follow me on my official social networks</p>
                </div>

                <!-- Social Links Section -->
                <div class="social-links">
                    
                    <a href="YOUTUBE_LINK_EKA_METHANATA_DANNA" class="social-btn yt" target="_blank">
                        <i class="fa-brands fa-youtube" style="color: #ff0000;"></i> YouTube
                    </a>
                    
                    <a href="FACEBOOK_LINK_EKA_METHANATA_DANNA" class="social-btn fb" target="_blank">
                        <i class="fa-brands fa-facebook" style="color: #1877f2;"></i> Facebook
                    </a>
                    
                    <a href="TIKTOK_LINK_EKA_METHANATA_DANNA" class="social-btn tt" target="_blank">
                        <i class="fa-brands fa-tiktok"></i> TikTok
                    </a>
                    
                    <a href="DISCORD_LINK_EKA_METHANATA_DANNA" class="social-btn dc" target="_blank">
                        <i class="fa-brands fa-discord" style="color: #5865F2;"></i> Discord
                    </a>
                    
                    <a href="TELEGRAM_LINK_EKA_METHANATA_DANNA" class="social-btn tg" target="_blank">
                        <i class="fa-brands fa-telegram" style="color: #0088cc;"></i> Telegram
                    </a>
                    
                </div>

            </div>
        </section>
    </div>

    <!-- ඔබ ලබාදුන් Footer එක -->
    <footer>&copy; 2026 DevTools Hub. All Rights Reserved.</footer>

</body>
</html>
